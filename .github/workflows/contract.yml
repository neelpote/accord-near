name: NEAR contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts-near
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Formatting and unit tests
        run: |
          cargo fmt --check
          cargo test --locked --lib
          cargo clippy --locked --all-targets -- -D warnings
      - name: Install verified cargo-near
        run: |
          curl -fsSL https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz -o /tmp/cargo-near.tar.gz
          curl -fsSL https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz.sha256 -o /tmp/cargo-near.sha256
          python3 -c 'import hashlib; assert hashlib.sha256(open("/tmp/cargo-near.tar.gz","rb").read()).hexdigest() == open("/tmp/cargo-near.sha256").read().split()[0]'
          mkdir -p /tmp/accord-cargo-near
          tar -xzf /tmp/cargo-near.tar.gz -C /tmp/accord-cargo-near
          find /tmp/accord-cargo-near -name cargo-near -type f -exec cp {} "$HOME/.cargo/bin/cargo-near" \;
      - name: Build and execute real WASM
        run: |
          cargo near build non-reproducible-wasm --locked --no-abi
          cargo test --locked --test test_basics -- --nocapture
