name: accord
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: accord
      POSTGRES_PASSWORD: accord-local-only
      POSTGRES_DB: accord
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - accord_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accord -d accord"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  accord_postgres:
